<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Blog posts · Dr. Nauman Bashir</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202223;font:15px/1.5 system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,select,summary{cursor:pointer}button,.upload span{background:#f3f3f3;border:1px solid #ddd;border-radius:8px;padding:6px 12px;font-weight:550}button:hover,.tool:hover{background:#e8e8e8}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #2868ba}header{padding:17px 3%;display:flex;align-items:center;gap:10px}header button{background:white;border-radius:50%}main{width:min(1140px,94%);margin:8px auto 64px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.save{background:#202223;color:white}.save:hover{background:#383838}h1{font-size:28px;font-weight:620;letter-spacing:-.04em}h2,h3{font-size:16px}form{display:grid;grid-template-columns:minmax(0,2.7fr) minmax(220px,1fr);gap:4%}.card,details{background:white;border:1px solid #dedede;border-radius:16px;padding:18px;box-shadow:0 2px 12px #0000000b;margin-bottom:22px}label,.label{display:block;margin-bottom:6px;font-weight:550}input:not([type=radio]),textarea,select{width:100%;padding:8px 11px;border:1px solid #ccc;border-radius:8px;background:white}textarea{resize:vertical}.composer{border:1px solid #ccc;border-radius:9px;overflow:hidden}.tools{display:flex;align-items:center;gap:2px;flex-wrap:wrap;background:#f6f6f6;padding:5px;border-bottom:1px solid #ddd}.tools select{width:auto;padding:4px;background:transparent;border:0}.tool{border:0;background:transparent;padding:3px 7px;min-width:26px}.tools input[type=color]{width:27px;height:25px;padding:2px}.canvas{min-height:235px;padding:14px;outline:0;overflow-wrap:anywhere}.canvas img,.cover img{max-width:100%;max-height:320px}.canvas table,.canvas td,.canvas th{border:1px solid #bbb;border-collapse:collapse;padding:.4em}.canvas h2{font-size:24px}.canvas h3{font-size:20px}.canvas:focus{box-shadow:inset 0 0 0 2px #9ab5d0}.side section{border-bottom:1px solid #eee;padding:0 0 19px;margin-bottom:20px}.side label{margin-top:9px}.upload{border:1px dashed #aaa;text-align:center;padding:32px 8px;border-radius:12px;cursor:pointer;font-weight:400}.upload small{display:block;margin-top:9px}.upload:focus-within{outline:2px solid #2868ba}.upload input{position:absolute;width:1px!important;height:1px;opacity:0}.heading{margin:18px 0 8px}summary{font-weight:600}.meta{color:#62666a;font-size:14px}.snippet{color:#253e90;font-size:19px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-bottom:1px solid #eee}.row button{border:0;background:none;text-align:left}.row small{color:#666}.msg{color:#734723}.msg:empty{display:none}[hidden]{display:none!important}@media(max-width:740px){form{grid-template-columns:1fr}.top{align-items:center}.canvas{min-height:210px}.side{margin-top:6px}main{width:94%}.card,details{padding:14px}.tools{row-gap:5px}}
</style><header><button id="back" aria-label="Back to blog posts">‹</button><span>Blog posts</span></header><main><div class="top"><h1 id="heading">Add blog post</h1><button id="save" class="save" form="post">Save draft</button></div><p role="status" class="msg" id="message"></p><div id="library" hidden></div>
<form id="post"><div><div class="card"><label for="title">Title</label><input id="title" required maxlength="220" placeholder="e.g., Preparing for your first surgical visit"><p class="label heading">Content</p><div class="composer"><div id="tools" class="tools" role="toolbar" aria-label="Text formatting"><select aria-label="Paragraph style" id="block"><option value="p">Paragraph</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select></div><div id="body" class="canvas" contenteditable="true" role="textbox" aria-label="Post content" aria-multiline="true"></div></div></div>
<details open><summary>Excerpt</summary><label for="summary" class="meta">Summary shown on the blog page</label><textarea id="summary" rows="2" maxlength="600"></textarea></details><details><summary>Search engine listing</summary><p class="snippet" id="snippet"></p><label>Page title<input id="seoTitle" maxlength="180"></label><label>Meta description<textarea id="seoDescription" maxlength="600"></textarea></label><label>URL ending<input id="slug" maxlength="100" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label></details></div>
<div class="side"><section><h2>Visibility</h2><label><input type="radio" name="visibility" id="visible"> Visible</label><label><input type="radio" name="visibility" id="hidden" checked> Hidden</label><label>Publication date<input id="date" type="date" required></label></section><section class="cover"><h2>Image</h2><img id="cover" hidden alt=""><label class="upload" id="drop"><span>Add image</span><small>or drop an image to upload</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><button id="remove" type="button" hidden>Remove image</button><label id="altLabel" hidden>Image description<input id="alt" maxlength="350"></label></section><section><h2>Organization</h2><label>Author<input id="publisher" required maxlength="150"></label><label>Tags<input id="tags" maxlength="600" placeholder="Separate tags with commas"></label></section></div></form><input hidden type="file" id="inlineFile" accept="image/jpeg,image/png,image/webp"></main>
<script>
const $=id=>document.getElementById(id),body=$('body'),form=$('post');
let posts=[],current=null,image='',range=null,dirty=false,busy=false;
const message=t=>{$('message').textContent=t};
async function api(path,opts){const r=await fetch('/api/editor/'+path,opts);if(!r.ok)throw Error(await r.text());return r}
function cover(){ $('cover').hidden=!image;if(image)$('cover').src=image;else $('cover').removeAttribute('src');$('altLabel').hidden=$('remove').hidden=!image;$('alt').required=!!image}
function sync(){dirty=true;$('snippet').textContent=$('seoTitle').value||$('title').value;$('save').textContent=$('hidden').checked?'Save draft':current&&!current.hidden?'Save changes':'Publish post'}
form.oninput=sync;
function openPost(p){current=p;range=null;form.reset();for(const k of ['title','slug','summary','publisher','tags','seoDescription','seoTitle','alt','date'])$(k).value=p?.[k]||'';$('date').value||=new Date().toLocaleDateString('en-CA');$('publisher').value||='Dr. Nauman Bashir';$('slug').readOnly=!!p;$('visible').checked=!!p&&!p.hidden;$('hidden').checked=!$('visible').checked;body.innerHTML=p?.editorHTML||'';image=p?.image||'';cover();$('heading').textContent=p?'Edit blog post':'Add blog post';$('library').hidden=true;form.hidden=$('save').hidden=false;message('');sync();dirty=false}
function list(){if(busy||dirty&&!confirm('Discard your unsaved changes?'))return;dirty=false;form.hidden=$('save').hidden=true;$('library').hidden=false;$('heading').textContent='Blog posts';$('library').replaceChildren();let add=document.createElement('button');add.textContent='Add blog post';add.onclick=()=>openPost(null);$('library').append(add);for(const p of posts){let row=document.createElement('div'),btn=document.createElement('button'),status=document.createElement('small');row.className='row';btn.textContent=p.title;btn.onclick=()=>openPost(p);status.textContent=p.hidden?'Hidden':'Visible';row.append(btn,status);$('library').append(row)}}
$('back').onclick=list;window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&body.contains(s.anchorNode)&&body.contains(s.focusNode))range=s.getRangeAt(0).cloneRange()});
function focusText(){body.focus();if(range&&body.contains(range.commonAncestorContainer)){const s=getSelection();s.removeAllRanges();s.addRange(range)}}
function cmd(name,value){focusText();document.execCommand(name,false,value);sync()}
function tool(name,label,action){const b=document.createElement('button');b.type='button';b.className='tool';b.title=name;b.setAttribute('aria-label',name);b.innerHTML=label;b.onmousedown=e=>e.preventDefault();b.onclick=action;$('tools').append(b)}
$('block').onchange=e=>cmd('formatBlock',e.target.value);
for(const [name,label,command] of [['Bold','<b>B</b>','bold'],['Italic','<i>I</i>','italic'],['Underline','<u>U</u>','underline'],['Strikethrough','<s>S</s>','strikeThrough'],['Bulleted list','• ≡','insertUnorderedList'],['Numbered list','1 ≡','insertOrderedList'],['Decrease indent','⇤','outdent'],['Increase indent','⇥','indent'],['Clear formatting','⊘','removeFormat'],['Undo','↶','undo'],['Redo','↷','redo']])tool(name,label,()=>cmd(command));
const align=document.createElement('select');align.setAttribute('aria-label','Text alignment');for(const a of ['Left','Center','Right','Full'])align.add(new Option(a==='Full'?'Justify':a,a));align.onchange=()=>cmd('justify'+align.value);$('tools').append(align);
const color=document.createElement('input');color.type='color';color.title='Text colour';color.setAttribute('aria-label','Text colour');color.onchange=()=>cmd('foreColor',color.value);$('tools').append(color);
tool('Insert link','Link',()=>{const url=prompt('Link URL (https://…)');if(!url||!/^https?:\/\//i.test(url))return;focusText();if(getSelection().isCollapsed)cmd('insertText',url);else cmd('createLink',url)});
tool('Insert image','Image',()=>$('inlineFile').click());tool('Insert table','▦',()=>cmd('insertHTML','<table><tbody><tr><th>Heading</th><th>Heading</th></tr><tr><td>Cell</td><td>Cell</td></tr></tbody></table><p><br></p>'));
body.onpaste=e=>{e.preventDefault();cmd('insertText',e.clipboardData.getData('text/plain'))};body.ondrop=e=>e.preventDefault();
async function upload(f,inside){if(!f||busy)return;busy=true;$('save').disabled=true;try{if(f.size>3000000)throw Error('Choose a JPEG, PNG or WebP image under 3 MB.');const src=await(await api('image',{method:'POST',body:f})).text();if(inside){const img=document.createElement('img');img.src=src;img.alt=prompt('Describe this image for readers')||'';img.style.maxWidth='100%';cmd('insertHTML',img.outerHTML)}else{image=src;cover();$('alt').focus()}sync();message('Image uploaded. Save the post to apply it.')}catch(e){message(e.message)}finally{busy=false;$('save').disabled=false;$('file').value=$('inlineFile').value=''}}
$('file').onchange=e=>upload(e.target.files[0],false);$('inlineFile').onchange=e=>upload(e.target.files[0],true);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files[0],false)};$('remove').onclick=()=>{image='';$('alt').value='';cover();sync()};
function serialize(n){if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';let tag=n.tagName.toLowerCase();if(tag==='font')tag='span';const a={tag,children:Array.from(n.childNodes,serialize)};if(tag==='a')a.href=n.getAttribute('href');if(tag==='img'){a.src=n.getAttribute('src');a.alt=n.alt}a.align=n.style.textAlign||n.getAttribute('align')||undefined;let c=n.style.color||n.getAttribute('color');if(c){const ctx=document.createElement('canvas').getContext('2d');ctx.fillStyle=c;a.color=ctx.fillStyle}return a}
form.onsubmit=async e=>{e.preventDefault();if(busy)return;const text=body.innerText.trim();if(!text){message('Write some content before saving.');body.focus();return}const p=Object.fromEntries(['title','summary','slug','publisher','date','tags','seoTitle','seoDescription','alt'].map(k=>[k,$(k).value.trim()]));p.slug||=p.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,90)||'post-'+Date.now();p.summary||=text.slice(0,180);Object.assign(p,{body:text,nodes:Array.from(body.childNodes,serialize),image,hidden:$('hidden').checked,version:current?.version??-1});busy=true;$('save').disabled=true;try{await api('posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});posts=await(await api('posts')).json();openPost(posts.find(x=>x.slug===p.slug));message(p.hidden?'Draft saved.':'Post published. ');if(!p.hidden){const a=document.createElement('a');a.href='/'+p.slug+'.html';a.textContent='View post';$('message').append(a)}}catch(e){message(e.message)}finally{busy=false;$('save').disabled=false}};
form.hidden=true;$('save').hidden=true;api('posts').then(r=>r.json()).then(data=>{posts=data;openPost(null)}).catch(e=>message(e.message));
</script></html>
