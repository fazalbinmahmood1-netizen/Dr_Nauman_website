<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Article editor | Dr. Nauman Bashir</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6f2;color:#202a39;font:16px/1.55 system-ui,sans-serif}header{background:white;padding:18px 5%;border-bottom:2px solid #c79960;display:flex;justify-content:space-between;align-items:center}header strong,h1,h2,h3{font-family:Georgia,serif;font-weight:400}header strong{font-size:24px}a{color:#61411c}main{max-width:1220px;margin:auto;padding:32px 5%}h1{font-size:38px;margin:0 0 16px}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.panel{background:white;padding:clamp(16px,3vw,32px);border:1px solid #ddd6cb;min-width:0}label{display:block;font-weight:600;margin:12px 0}input,textarea,select,button{font:inherit}input,textarea,select{width:100%;padding:.6em;border:1px solid #aca8a2}textarea{resize:vertical}button{cursor:pointer;background:#252525;color:white;border:0;padding:.6em 1em}button:disabled{opacity:.5}#preview{overflow-wrap:anywhere}#preview img{width:100%}.toolbar button{background:#f1ede6;color:#222}.toolbar{display:flex;gap:.4em;flex-wrap:wrap}#message{min-height:1.5em;font-weight:600}small{font-weight:400}aside h2{margin-top:0}#unlock{max-width:32em}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><header><strong>Dr. Nauman Bashir</strong><a href="/blog.html">Open blog</a></header><main><h1>Article editor</h1><p id="message" role="status"></p>
<div id="studio" hidden><label>Choose an article<select id="choice"></select></label><div class="grid"><form id="form" class="panel"><label>Article heading<input id="title" required maxlength="220"></label><label>Article URL ending<input id="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" maxlength="100"></label><label>Publication date<input id="date" type="date" required></label><label>Publisher or author<input id="publisher" required maxlength="150"></label><label>Summary for the blog and search results<textarea id="summary" required rows="3" maxlength="600"></textarea></label><label>Cover image <small>(JPEG, PNG or WebP, up to 3 MB)</small><input id="upload" type="file" accept="image/jpeg,image/png,image/webp"></label><button type="button" id="remove" hidden>Remove image</button><label>Image description<input id="alt" maxlength="350"></label><label for="body">Article content</label><div class="toolbar"><button type="button" data-prefix="## ">Heading</button><button type="button" data-prefix="### ">Subheading</button></div><small>Separate paragraphs with a blank line. Add links as [label](https://example.com).</small><textarea id="body" rows="17" required maxlength="100000"></textarea><button id="publish">Publish article</button></form><aside class="panel"><h2>Live preview</h2><article id="preview"></article></aside></div></div></main>
<script>
const el=id=>document.getElementById(id), ids=['slug','title','publisher','date','summary','body','alt'];
let posts=[], current=null, image='', busy=false, dirty=false;
if(location.hash)history.replaceState(null,'',location.pathname);
function status(s){el('message').textContent=s}
async function api(path,options={}){const r=await fetch('/api/editor/'+path,{...options,credentials:'same-origin'});if(!r.ok)throw Error(await r.text());return r}
function options(selected=''){el('choice').replaceChildren(new Option('New article',''),...posts.map(p=>new Option(p.title,p.slug)));el('choice').value=selected}
function preview(){const root=el('preview');root.replaceChildren();function node(tag,t){const n=document.createElement(tag);n.textContent=t;root.append(n);return n}node('h2',el('title').value||'Untitled article');node('small',[el('date').value,el('publisher').value].filter(Boolean).join(' · '));if(image){const img=node('img','');img.src=image;img.alt=el('alt').value}
for(const line of el('body').value.split(/\n+/).filter(Boolean)){const n=node(line.startsWith('### ')?'h3':line.startsWith('## ')?'h2':'p','');for(const part of line.replace(/^#{2,3} /,'').split(/(\[[^\]\n]+\]\([^)\s]+\))/g)){const m=part.match(/^\[([^\]]+)\]\(([^)]+)\)$/);if(m&&/^(https?:\/\/|[a-z0-9-]+\.html(?:#[\w-]+)?$)/i.test(m[2])){const a=document.createElement('a');a.href=m[2];a.textContent=m[1];n.append(a)}else n.append(part)}}el('remove').hidden=!image;el('alt').required=!!image}
function edit(slug){current=posts.find(p=>p.slug===slug);for(const id of ids)el(id).value=current?.[id]||'';if(!current)el('date').value=new Date().toLocaleDateString('en-CA');image=current?.image||'';el('slug').readOnly=!!current;el('upload').value='';dirty=false;preview()}
async function openEditor(){try{posts=await(await api('posts')).json();el('studio').hidden=false;options();edit('');status('')}catch(e){status(e.message);}}
sessionStorage.removeItem('editor-key');openEditor();
el('choice').onchange=()=>{if(dirty&&!confirm('Discard unpublished changes?')){el('choice').value=current?.slug||'';return}edit(el('choice').value);status('')};
el('form').oninput=e=>{dirty=true;if(e.target===el('title')&&!current&&!el('slug').dataset.manual)el('slug').value=e.target.value.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(e.target===el('slug'))el('slug').dataset.manual='yes';preview()};
window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};
for(const b of document.querySelectorAll('[data-prefix]'))b.onclick=()=>{const t=el('body'),pos=t.value.lastIndexOf('\n',t.selectionStart-1)+1;t.setRangeText(b.dataset.prefix,pos,pos,'end');dirty=true;t.focus();preview()};
el('remove').onclick=()=>{image='';el('upload').value='';dirty=true;preview()};
function lock(value){busy=value;for(const id of ['publish','choice','upload','remove'])el(id).disabled=value}
el('upload').onchange=async()=>{const f=el('upload').files[0];if(!f)return;if(f.size>3000000){status('Choose an image smaller than 3 MB.');return}lock(true);try{image=await(await api('image',{method:'POST',body:f})).text();dirty=true;preview();status('Image ready. Publish to apply it.')}catch(e){status(e.message)}finally{lock(false)}};
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;lock(true);try{const p=Object.fromEntries(ids.map(id=>[id,el(id).value]));Object.assign(p,{image,version:current?.version??-1});const result=await(await api('posts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})).json();posts=posts.filter(x=>x.slug!==result.slug).concat(result);options(result.slug);edit(result.slug);status('Published. ');const a=document.createElement('a');a.href='/'+result.slug+'.html';a.textContent='Read article';el('message').append(a)}catch(e){status(e.message)}finally{lock(false)}};
</script></html>
